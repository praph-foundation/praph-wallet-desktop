[package]
name = "praph-wallet"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "praph_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_chacha = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "6"
bip39 = { version = "2", features = ["rand"] }
bip32 = "0.5"
rand = "0.8"
argon2 = "0.5"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chacha20poly1305 = "0.10"
aead = "0.5"
hex = "0.4"
base64 = "0.22"
keyring = "3"
zeroize = "1"
tokio = { version = "1", features = ["time"] }
rayon = "1.11"

bs58 = "0.5"
blake2 = "0.10"
k256 = "0.13"
sp-core = { version = "32", default-features = false, features = ["full_crypto", "std"] }

praph-circuits = { path = "../../PRAPH/circuits", features = ["halo2"] }

# L2 ETH wallet support
ethers = { version = "2.0", default-features = false, features = ["rustls", "legacy"] }
sha3 = "0.10"

# Bridge encryption (Phase 2)
jsonrpsee = { version = "0.20", features = ["http-client"] }
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"

